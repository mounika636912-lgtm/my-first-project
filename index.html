```html

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expense Tracker</title>

  <style>
    * {

    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;

    .card p {

    input, select, button {

</head>

<body>
  <main class="container">

    <h1>My Expense Tracker</h1>
    <p>Track your money, one day at a time.</p>

    <!-- Summary cards -->

    <section class="cards">
      <div class="card">
        <p>Total Income</p>
        <h2 class="income" id="income">₹0.00</h2>
      </div>

      <div class="card">
        <p>Total Expenses</p>
        <h2 class="expense" id="expenses">₹0.00</h2>
      </div>

      <div class="card">
        <p>Available Balance</p>
        <h2 id="balance">₹0.00</h2>
      </div>
    </section>

    <!-- Pie chart -->

    <section class="panel" style="margin-bottom:20px">
      <h2>Monthly Expense Chart</h2>
      <p class="chart-subtitle">
        Category-wise spending overview
      </p>

      <div id="expenseChart">
        <p class="chart-empty">Loading chart...</p>
      </div>
    </section>

    <!-- Add transaction -->

    <section class="panel" style="margin-bottom:20px">
      <h2>Add Transaction</h2>

      <form id="transactionForm">
        <input
          id="description"
          placeholder="Description (e.g. Books)"
          required
        >

        <input
          id="amount"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="Amount (₹)"
          required
        >

        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <select id="category">
          <option>Food</option>
          <option>Travel</option>
          <option>Education</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Salary</option>
          <option>Other</option>
        </select>

        <input id="date" type="date" required>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction history -->

    <section class="panel">
      <h2>Transaction History</h2>
      <div id="transactionList">No transactions yet.</div>
    </section>

  </main>

  <script>
    (() => {
      const form = document.getElementById("transactionForm");
      const list = document.getElementById("transactionList");
      const dateInput = document.getElementById("date");
      const chart = document.getElementById("expenseChart");

      function getToday() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      dateInput.value = getToday();

      // Load previously saved transactions.
      let transactions = [];

      try {
        const saved = JSON.parse(
          localStorage.getItem("myExpenseData") || "[]"
        );

        if (Array.isArray(saved)) {
          transactions = saved
            .filter(t =>
              t &&
              typeof t.description === "string" &&
              Number.isFinite(Number(t.amount)) &&
              Number(t.amount) > 0 &&
              ["income", "expense"].includes(t.type)
            )
            .map(t => ({
              ...t,
              amount: Number(t.amount),
              category: t.category || "Other",
              date: t.date || getToday(),
              id: t.id || crypto.randomUUID()
            }));
        }
      } catch (error) {
        transactions = [];
      }

      const colors = {
        Food: "#5271e8",
        Travel: "#f39c45",
        Education: "#24a879",
        Shopping: "#9666dc",
        Bills: "#e65b69",
        Salary: "#20a6b5",
        Other: "#9aa4b2"
      };

      function getColor(category) {
        if (colors[category]) {
          return colors[category];
        }

        const palette = [
          "#5271e8",
          "#f39c45",
          "#24a879",
          "#9666dc",
          "#e65b69",
          "#20a6b5"
        ];

        let hash = 0;

        for (let i = 0; i < category.length; i++) {
          hash = category.charCodeAt(i) + ((hash << 5) - hash);
        }

        return palette[Math.abs(hash) % palette.length];
      }

      // Render a round pie chart using CSS conic-gradient.
      function renderChart() {
        chart.replaceChildren();

        const totals = {};
        const currentMonth = getToday().slice(0, 7);

        transactions
          .filter(t =>
            t.type === "expense" &&
            typeof t.date === "string" &&
            t.date.slice(0, 7) === currentMonth
          )
          .forEach(t => {
            const category = t.category || "Other";
            totals[category] =
              (totals[category] || 0) + Number(t.amount);
          });

        const categories = Object.entries(totals)
          .filter(([, amount]) => amount > 0)
          .sort((a, b) => b[1] - a[1]);

        const total = categories.reduce(
          (sum, item) => sum + item[1], 0
        );

        if (categories.length === 0 || total === 0) {
          const message = document.createElement("p");
          message.className = "chart-empty";
          message.textContent =
            "No expenses this month. Add an expense to see your pie chart.";

          chart.appendChild(message);
          return;
        }

        let angle = 0;
        const slices = [];

        categories.forEach(([category, amount]) => {
          const percentage = (amount / total) * 100;
          const endAngle = angle + percentage * 3.6;

          slices.push(
            `${getColor(category)} ${angle}deg ${endAngle}deg`
          );

          angle = endAngle;
        });

        const layout = document.createElement("div");
        layout.className = "chart-layout";

        const pie = document.createElement("div");
        pie.className = "pie-chart";
        pie.style.background =
          `conic-gradient(${slices.join(", ")})`;

        pie.setAttribute("role", "img");
        pie.setAttribute(
          "aria-label",
          "Pie chart of monthly expenses by category"
        );

        const legend = document.createElement("div");
        legend.className = "chart-legend";

        categories.forEach(([category, amount]) => {
          const percentage = (amount / total) * 100;

          const item = document.createElement("div");
          item.className = "legend-item";

          const colorBox = document.createElement("span");
          colorBox.className = "legend-color";
          colorBox.style.backgroundColor = getColor(category);

          const details = document.createElement("div");
          details.className = "legend-details";

          const name = document.createElement("span");
          name.className = "legend-name";
          name.textContent = category;

          const percent = document.createElement("span");
          percent.className = "legend-percentage";
          percent.textContent = `${percentage.toFixed(1)}%`;

          const value = document.createElement("span");
          value.className = "legend-amount";
          value.textContent = "₹" + amount.toFixed(2);

          details.append(name, percent);
          item.append(colorBox, details, value);
          legend.appendChild(item);
        });

        layout.append(pie, legend);
        chart.appendChild(layout);

        const totalBox = document.createElement("div");
        totalBox.className = "chart-total";
        totalBox.textContent = "Total expenses this month";

        const totalValue = document.createElement("strong");
        totalValue.textContent = "₹" + total.toFixed(2);

        totalBox.appendChild(totalValue);
        chart.appendChild(totalBox);
      }

      function render() {
        renderChart();

        const income = transactions
          .filter(t => t.type === "income")
          .reduce((sum, t) => sum + Number(t.amount), 0);

        const expenses = transactions
          .filter(t => t.type === "expense")
          .reduce((sum, t) => sum + Number(t.amount), 0);

        document.getElementById("income").textContent =
          "₹" + income.toFixed(2);

        document.getElementById("expenses").textContent =
          "₹" + expenses.toFixed(2);

        document.getElementById("balance").textContent =
          "₹" + (income - expenses).toFixed(2);

        list.replaceChildren();

        if (transactions.length === 0) {
          list.textContent = "No transactions yet.";
          return;
        }

        [...transactions].reverse().forEach(t => {
          const row = document.createElement("div");
          row.className = "transaction";

          const details = document.createElement("div");
          details.className = "transaction-details";

          const title = document.createElement("strong");
          title.textContent = t.description;

          const info = document.createElement("div");
          info.textContent = `${t.category} • ${t.date}`;

          details.append(title, info);

          const amount = document.createElement("span");
          amount.className = t.type;
          amount.textContent =
            (t.type === "income" ? "+" : "-") +
            "₹" + Number(t.amount).toFixed(2);

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Delete";

          remove.addEventListener("click", () => {
            transactions = transactions.filter(
              item => item.id !== t.id
            );
            save();
          });

          row.append(details, amount, remove);
          list.appendChild(row);
        });
      }

      function save() {
        localStorage.setItem(
          "myExpenseData",
          JSON.stringify(transactions)
        );
        render();
      }

      form.addEventListener("submit", event => {
        event.preventDefault();

        const description =
          document.getElementById("description").value.trim();

        const amount =
          Number(document.getElementById("amount").value);

        if (
          !description ||
          !Number.isFinite(amount) ||
          amount <= 0 ||
          !dateInput.value
        ) {
          alert("Enter a description, valid amount and date.");
          return;
        }

        transactions.push({
          id: crypto.randomUUID(),
          description,
          amount,
          type: document.getElementById("type").value,
          category: document.getElementById("category").value,
          date: dateInput.value
        });

        save();

        form.reset();
        dateInput.value = getToday();
      });

      render();
    })();
  </script>
</body>
</html>
